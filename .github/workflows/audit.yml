name: Artifact Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Write audit report
        run: |
          mkdir -p dist
          {
            echo "Artifact Audit report"
            echo "====================="
            echo "Generated by: Artifact Audit workflow (manual run)"
            echo "Repository:   $GITHUB_REPOSITORY"
            echo "Branch:       $GITHUB_REF_NAME"
            echo "Commit:       $GITHUB_SHA"
            echo "Run number:   $GITHUB_RUN_NUMBER"
            echo "Run id:       $GITHUB_RUN_ID"
            echo "Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "This report was uploaded as a GitHub Actions artifact named"
            echo "'audit-report' and attached to the release tagged 'v0.1.0'."
          } > dist/audit-report.txt
          echo "--- report contents ---"
          cat dist/audit-report.txt

      - name: Upload audit report artifact
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: dist/audit-report.txt
          retention-days: 30

      - name: Publish release v0.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists; refreshing the attached report."
            gh release upload v0.1.0 dist/audit-report.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v0.1.0 dist/audit-report.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "v0.1.0" \
              --notes "Workshop demo release published by the Artifact Audit workflow. It carries the audit report produced by this run."
          fi
          gh release view v0.1.0 --repo "$GITHUB_REPOSITORY"
